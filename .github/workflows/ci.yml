name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write  # Publish Test Report creates a check run

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew

    - name: Lint Check
      run: ./gradlew lint --no-daemon

    - name: Detekt and Ktlint
      run: ./gradlew detekt ktlintCheck --no-daemon

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    # The bundle that goes to Play, unsigned because CI has no upload key. Only release builds run
    # R8 and lint's release checks (lintVital).
    - name: Build Release Bundle
      run: ./gradlew bundleRelease --no-daemon

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: '**/build/test-results/**'
        retention-days: 30

    # A pull request from a fork gets a read-only token, which can't create the check run.
    - name: Publish Test Report
      if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: dorny/test-reporter@v3
      with:
        name: Unit Test Results
        path: '**/build/test-results/testDebugUnitTest/**.xml'
        reporter: 'java-junit'
        fail-on-error: false
        fail-on-empty: false

  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew

    # Without KVM the emulator runs unaccelerated, and the UI tests fail waiting for window focus.
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # The runner's preinstalled command-line tools are too old for minor-versioned images such as
    # android-37.0: with 12.0 (Ubuntu 24.04), avdmanager writes target=android-0 into the AVD, and
    # the emulator boots it as the wrong API level and can stall. The emulator runner uses the
    # runner's cmdline-tools/latest whenever one exists, so replace it with 22.0, which writes
    # target=android-37.0. The checksum is printed so the download can be pinned later.
    - name: Install Android command-line tools 22.0
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/cmdline-tools.zip" \
          https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
        sha256sum "$RUNNER_TEMP/cmdline-tools.zip"
        unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools"
        rm -rf "$ANDROID_HOME/cmdline-tools/latest"
        mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

    # Android 17 (API 37), where the instrumented tests are checked locally. The level is quoted
    # because YAML would read 37.0 as the number 37, and there is no android-37 image.
    - name: Run Connected Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: '37.0'
        target: google_apis
        arch: x86_64
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
        disable-animations: true
        # Annotate the run if the AVD still has the wrong target. The action boots it anyway.
        pre-emulator-launch-script: |
          grep '^target=' "$ANDROID_AVD_HOME/test.ini"
          grep -qx 'target=android-37.0' "$ANDROID_AVD_HOME/test.ini" || { echo "::error::The AVD target isn't android-37.0; avdmanager is too old for this image."; exit 1; }
        script: ./gradlew connectedAndroidTest --no-daemon

    - name: Upload Instrumented Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: instrumented-test-results
        path: '**/build/outputs/androidTest-results/**'
        retention-days: 30
