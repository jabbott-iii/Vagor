name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sundays at 2 AM UTC

permissions:
  contents: read

jobs:
  codeql-kotlin:
    name: CodeQL Analysis (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ java-kotlin ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # CodeQL can analyse Kotlin only by watching it compile, in the build step below.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew

    # Every compile has to run where CodeQL can see it: no build cache, and Kotlin compiles inside
    # the Gradle process instead of a separate Kotlin daemon.
    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:java-kotlin"
